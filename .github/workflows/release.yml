name: Release images

# ทำงานเมื่อ push tag เวอร์ชัน เช่น v1.0.0 เท่านั้น push ปกติไม่ publish อะไร
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      matrix:
        include:
          - name: vulncompass
            context: .
          - name: vulncompass-web
            context: frontend

    # สิทธิ์เพิ่มเฉพาะ job นี้: push image ขึ้น ghcr.io และเซ็น attestation
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}

    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # build ไว้ในเครื่องของ runner ก่อน เพื่อสแกนก่อนตัดสินใจ publish
      - name: Build the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan-target:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Install Trivy
        run: sudo bash scripts/install_trivy.sh

      # ไม่ publish image ที่มีช่องโหว่ critical ซึ่งมีเวอร์ชันแก้แล้ว (ถ้ายังไม่มีเวอร์ชันแก้ ก็อัปเดตไม่ได้อยู่ดี)
      - name: Block the release on fixable critical vulnerabilities
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 scan-target:latest

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ใช้ cache จากขั้น build ด้านบน จึงไม่ build ใหม่ทั้งหมด
      # sbom = รายการ package ทั้งหมดใน image, provenance = บันทึกว่า image สร้างจากที่ไหนอย่างไร
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max

      # ลายเซ็นของ GitHub ที่พิสูจน์ได้ว่า image นี้สร้างจาก repo นี้ใน workflow นี้จริง
      # คนใช้ตรวจได้ด้วย: gh attestation verify oci://<image> --repo jjjecop/security-pipe-ine
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
