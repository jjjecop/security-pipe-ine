name: Tests

on:
  push:
    branches: [main]
  pull_request:

# token ของ workflow อ่านโค้ดได้อย่างเดียว ถ้ามี step ไหนถูกเจาะก็แก้ repo ไม่ได้
permissions:
  contents: read 

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci ติดตั้งตาม package-lock.json เป๊ะ ๆ และไม่รันสคริปต์ของแพ็กเกจตอนติดตั้ง
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build