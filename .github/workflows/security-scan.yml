name: Security self-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ล็อก action ด้วย commit SHA แทน tag เพราะ tag ถูกย้ายไปชี้โค้ดอื่นได้
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ใช้ GitHub Action ของเราเอง (action.yml) สแกนตัวเอง เป็นการทดสอบ action ไปในตัว
      # ถ้า action เสีย workflow นี้จะพังก่อนที่คนอื่นจะได้ใช้
      - name: Scan VulnCompass with the VulnCompass action
        uses: ./
        with:
          project: VulnCompass
          scans: sast,dependency
          fail-on: critical
