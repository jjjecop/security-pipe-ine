services:
  postgres:  # Automated Security Assessment & Reporting Pipeline ครับเป็นระบบที่ ระบบที่รับ source cod
    image: postgres:16-alpine #ไปดึงโปรแกรมสำเร็จรูปนี้มาใช้" แทนที่เราจะต้องเขียน Postgres เอง
    container_name: secpipeline-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data  

  redis:
    image: redis:7-alpine
    container_name: secpipeline-redis
    ports:
      - "127.0.0.1:6379:6379"
volumes: 
  pg_data:
   


