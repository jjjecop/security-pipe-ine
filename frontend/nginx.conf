server {
    listen 8080;
    root /usr/share/nginx/html;

    # ส่ง /api/... ต่อให้ FastAPI โดยตัด /api ออก เหมือน proxy ของ Vite ตอนพัฒนา
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # ใช้ IP ที่ nginx เห็นจริง ไม่ต่อท้ายค่าที่ผู้ใช้ส่งมาเอง ผู้ใช้จึงปลอม IP เพื่อหลบการจำกัด login ไม่ได้
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}