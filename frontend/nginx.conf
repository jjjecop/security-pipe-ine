server {
    listen 8080;
    root /usr/share/nginx/html;

    # DNS ภายในของ Docker ถ้าเขียนชื่อ api ตรงๆ ใน proxy_pass nginx จะหา IP ครั้งเดียวตอนเปิด
    # พอ container api ถูกสร้างใหม่และได้ IP ใหม่ nginx จะยังส่งไป IP เก่าแล้วได้ 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ส่ง /api/... ต่อให้ FastAPI โดยตัด /api ออก เหมือน proxy ของ Vite ตอนพัฒนา
    location /api/ {
        # ใช้ตัวแปร nginx จึงหา IP ใหม่ทุก 10 วินาทีผ่าน resolver ข้างบน
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # ใช้ IP ที่ nginx เห็นจริง ไม่ต่อท้ายค่าที่ผู้ใช้ส่งมาเอง ผู้ใช้จึงปลอม IP เพื่อหลบการจำกัด login ไม่ได้
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}